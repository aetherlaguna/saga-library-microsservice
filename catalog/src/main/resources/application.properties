spring.application.name=catalog

spring.datasource.url=jdbc:postgresql://catalog-db:5432/catalog
spring.datasource.username=catalog
spring.datasource.password=${CATALOG_DB_PASSWORD}

#log
logging.level.root=INFO
logging.level.com.library.catalog=DEBUG
management.endpoint.health.show-components=never
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# Reliable outbox publisher; retries are persisted in PostgreSQL.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.template.retry.enabled=false
spring.rabbitmq.connection-timeout=3s
library.outbox.enabled=true
library.outbox.poll-interval-ms=1000
library.outbox.batch-size=20
library.outbox.max-message-failures=5
library.outbox.confirm-timeout-ms=5000
library.outbox.retry-delay-ms=1000
library.outbox.max-retry-delay-ms=60000
catalog.consumer.enabled=true
catalog.consumer.concurrency=2
catalog.consumer.retry-backoff-ms=1000
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.retry.enabled=false

# Structured logs and bounded-cardinality monitoring.
logging.structured.format.console=logstash
management.metrics.tags.application=${spring.application.name}
management.endpoints.web.exposure.include=health,prometheus
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}

management.tracing.export.enabled=${TRACING_EXPORT_ENABLED:false}

# Prometheus is the metrics backend; do not also push metrics to a default OTLP receiver.
management.otlp.metrics.export.enabled=false
