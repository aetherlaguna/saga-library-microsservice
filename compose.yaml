services:
  loans-db:
    image: postgres:17
    environment:
      POSTGRES_DB: loans
      POSTGRES_USER: loans
      POSTGRES_PASSWORD: secure_pass
    volumes:
      - loans-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loans -d loans"]
      interval: 5s
      timeout: 5s
      retries: 10
  loans:
    build:
      context: ./loans
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://loans-db:5432/loans
      SPRING_DATASOURCE_USERNAME: loans
      SPRING_DATASOURCE_PASSWORD: secure_pass
    depends_on:
      loans-db:
        condition: service_healthy

volumes:
  loans-db-data:
