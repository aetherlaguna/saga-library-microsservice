spring.application.name=loans

spring.datasource.url=jdbc:postgresql://loans-db:5432/loans
spring.datasource.username=loans
spring.datasource.password=${LOANS_DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

#log
management.endpoints.web.exposure.include=health
logging.level.root=INFO
logging.level.com.library.loans=DEBUG
management.endpoint.health.show-components=never
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,rabbit
